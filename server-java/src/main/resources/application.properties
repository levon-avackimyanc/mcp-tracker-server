# Транспорт — stdio: сервер общается с клиентом через stdin/stdout.
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=task-tracker
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Приложение не веб-сервер и не должно ничего печатать в stdout:
# stdout занят протоколом JSON-RPC, посторонняя строка разрывает сессию.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.threshold.console=OFF
logging.file.name=logs/tracker-mcp.log

# Версия контракта по умолчанию; переключается ключом --spring.profiles.active=v1
spring.profiles.default=v2
