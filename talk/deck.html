<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Когда пользователь — не человек — доклад для QA</title>
<style>
  :root{
    --ink:#14171F; --panel:#1D222D; --panel2:#232937; --line:#2E3542;
    --text:#E9ECF2; --muted:#98A1B3; --dim:#5C6577;
    --amber:#E8A33D; --amber-soft:rgba(232,163,61,.12);
    --ok:#4FC38A; --bad:#E0564F;
    --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;height:100%}
  /* ---------- stage: fixed 1280x720, scaled to viewport ---------- */
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:var(--ink)}
  .slide{display:none;position:absolute;inset:0;flex-direction:column;padding:56px 72px 64px;box-sizing:border-box}
  .slide.on{display:flex}
  @media (prefers-reduced-motion: no-preference){
    .slide.on{animation:in .25s ease-out}
    @keyframes in{from{opacity:0}to{opacity:1}}
  }
  /* ---------- chrome ---------- */
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:22px}
  .eyebrow b{color:var(--amber);font-weight:500}
  h1{font-size:34px;line-height:1.15;margin:0 0 26px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
  h1 .hl{color:var(--amber)}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:var(--amber);width:0;transition:width .2s}
  #count{position:fixed;right:16px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  #notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:14px 24px 18px;font-size:15px;line-height:1.5;color:var(--muted);display:none}
  #notes.show{display:block}
  #notes strong{color:var(--text)}
  .notes{display:none}
  /* ---------- content atoms ---------- */
  .cols{display:flex;gap:28px;flex:1;min-height:0}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 24px}
  .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  ul.pts{margin:0;padding-left:20px;font-size:19px;line-height:1.55;display:flex;flex-direction:column;gap:10px}
  ul.pts li::marker{color:var(--amber)}
  .small{font-size:15px;color:var(--muted);line-height:1.5}
  code,pre{font-family:var(--mono)}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:15px;line-height:1.55;overflow-x:auto;margin:0}
  pre .c{color:var(--dim)} pre .s{color:var(--ok)} pre .k{color:var(--amber)}
  .good{color:var(--ok)} .badc{color:var(--bad)} .acc{color:var(--amber)}
  .banner{margin-top:auto;background:var(--amber-soft);border:1px solid rgba(232,163,61,.35);border-radius:6px;padding:14px 20px;font-size:19px;font-weight:600;text-align:center}
  /* ---------- screenshot placeholders ---------- */
  .shot{margin:0;flex:1;min-height:120px;border:1.5px dashed rgba(232,163,61,.5);border-radius:6px;background:var(--amber-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;position:relative}
  .shot .shot-tag{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
  .shot .shot-desc{font-size:14px;color:var(--muted);max-width:46ch;line-height:1.45}
  .shot img{display:none}
  .shot.has-img{border:1px solid var(--line);background:var(--panel);padding:6px}
  .shot.has-img img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
  .shot.has-img .shot-tag,.shot.has-img .shot-desc{display:none}
  /* ---------- diagrams ---------- */
  .chain{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;flex-wrap:nowrap}
  .chain .node{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-align:center;line-height:1.35;flex:1}
  .chain .node em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:3px}
  .chain .arr{color:var(--amber);font-size:18px;flex:0 0 auto}
  table.tbl{border-collapse:collapse;width:100%;font-size:17px}
  table.tbl th{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line)}
  table.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
  table.tbl tr.hi td{background:var(--amber-soft)}
  /* таблицы eval-прогонов: числа в моно, строка «вызовов» — подстрочником к success rate */
  table.tbl.ev{font-family:var(--mono);font-size:15px}
  table.tbl.ev th{padding:5px 9px;text-align:right}
  table.tbl.ev td{padding:6px 9px;text-align:right;border-bottom:none}
  table.tbl.ev th:first-child,table.tbl.ev td:first-child{text-align:left}
  table.tbl.ev td.g{color:var(--ok)} table.tbl.ev td.b{color:var(--bad)}
  table.tbl.ev tr.calls td{color:var(--dim);font-size:12.5px;padding-top:0;padding-bottom:8px}
  table.tbl.ev caption{caption-side:top;text-align:left;font-family:var(--mono);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--amber);padding-bottom:6px}
  .fails{display:flex;gap:20px;margin-top:26px}
  .fail{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
  .fail b{display:block;font-size:20px;margin-bottom:6px}
  .fail .n{font-family:var(--mono);color:var(--amber);font-size:13px;letter-spacing:.12em;display:block;margin-bottom:8px}
  .rate{display:flex;gap:5px;margin-top:14px}
  .rate i{flex:1;height:26px;border-radius:3px;background:var(--ok)}
  .rate i.f{background:var(--bad)}
  .xmark{color:var(--bad);font-weight:700} .vmark{color:var(--ok);font-weight:700}
  .check{margin:0;padding:0;list-style:none;columns:2;column-gap:40px;font-size:16.5px;line-height:1.45}
  .check li{margin-bottom:11px;break-inside:avoid;display:flex;gap:10px}
  .check li i{font-style:normal;font-family:var(--mono);color:var(--amber);font-size:13px;padding-top:2px}
  .diffline{display:block}
  .diffline.del{color:var(--bad)} .diffline.add{color:var(--ok)}
  /* title slide */
  .title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
  .title-wrap h1{font-size:58px;line-height:1.08;margin:0 0 18px;font-weight:700;letter-spacing:-.02em;max-width:20ch}
  .title-wrap .sub{font-size:26px;color:var(--muted);max-width:38ch;line-height:1.4;text-wrap:balance}
  .title-meta{margin-top:auto;font-family:var(--mono);font-size:15px;color:var(--dim);display:flex;justify-content:space-between}
  .keys{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .thesis{font-size:30px;line-height:1.35;font-weight:600;text-wrap:balance;max-width:34ch}
</style>

<div id="stage"></div>
<div id="bar"></div><div id="count"></div><div id="notes"></div>

<template id="slides">

<!-- ===== 01 ===== -->
<section class="slide" data-block="Открытие">
  <div class="title-wrap">
    <div class="eyebrow" style="margin-bottom:40px"><span>Доклад · QA</span><span>MCP · тестирование</span></div>
    <h1>Когда пользователь — не&nbsp;человек</h1>
    <div class="sub">Тестирование <span class="acc">MCP</span>-серверов</div>
  </div>
  <div class="title-meta"><span>Левон Авакимянц · Сбер</span><span class="keys">← → листать · N — заметки докладчика</span></div>
  <aside class="notes">Ничего не говорим — сразу переключаем на следующий слайд: с ходу задаём рамку доклада — чем мир агентов отличается от привычного.</aside>
</section>

<!-- ===== 02 ===== -->
<section class="slide" data-block="Два мира">
  <div class="eyebrow"><span>Два мира</span><span>02 / 24</span></div>
  <h1>Два мира API: у привычного и у агентского — <span class="hl">разные контракты</span></h1>
  <div class="cols">
    <div class="col card">
      <div class="lbl">REST / привычный мир</div>
      <ul class="pts">
        <li>Контракт = OpenAPI-схема</li>
        <li>Description — декорация: перепишите как угодно, ни один клиент не сломается</li>
        <li>Потребитель — код</li>
        <li>Тест проверяет <b>код</b> — вердикт <b class="good">pass / fail</b></li>
      </ul>
    </div>
    <div class="col card" style="border-color:rgba(232,163,61,.4)">
      <div class="lbl" style="color:var(--amber)">MCP / мир агентов</div>
      <ul class="pts">
        <li>Контракт = схема <b>+ description</b></li>
        <li>Текст исполняем: формулировка меняет поведение системы</li>
        <li>Потребитель — модель</li>
        <li>Тест проверяет ещё и <b>текст</b> — вердикт <b class="acc">success rate</b></li>
      </ul>
    </div>
  </div>
  <div class="banner">Изменение description = breaking change, который не ловит ни один существующий тест</div>
  <aside class="notes">С этого и начнём — чем мир агентов отличается от привычного. В API для людей контракт — это схема: description в OpenAPI можно переписать как угодно, ни один клиент не сломается, потому что потребитель — код. В API для агентов потребитель — <strong>модель, и она читает текст</strong>. Поэтому контракт здесь — схема плюс description: переформулируете описание — поведение системы изменится, хотя логика не тронута. Значит, изменение description — breaking change, который не ловит ни один существующий тест. Из этого различия вырастает весь доклад.</aside>
</section>

<!-- ===== 03 ===== -->
<section class="slide" data-block="Два мира">
  <div class="eyebrow"><span>Два мира</span><span>03 / 24</span></div>
  <h1>Значит, и тест другой — <span class="hl">не pass/fail, а success rate</span></h1>
  <div class="cols">
    <div class="col card">
      <div class="lbl">Классический тест</div>
      <ul class="pts" style="font-size:17px">
        <li>Вход → выход <b>детерминирован</b></li>
        <li>Вердикт: <b class="good">pass</b> / <b class="badc">fail</b></li>
        <li>Проверяем поведение <b>кода</b></li>
        <li>Один прогон — и есть ответ</li>
      </ul>
    </div>
    <div class="col card" style="border-color:rgba(232,163,61,.4)">
      <div class="lbl" style="color:var(--amber)">Тест агентного взаимодействия</div>
      <ul class="pts" style="font-size:17px">
        <li>Тот же вход → выход <b>варьируется</b></li>
        <li>Вердикт: <b class="acc">success rate</b> — частота, не булево</li>
        <li>Проверяем ещё и <b>текст, который читает модель</b></li>
        <li>Нужно N прогонов, чтобы измерить</li>
      </ul>
      <div class="rate"><i class="f"></i><i></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i class="f"></i><i class="f"></i><i></i><i class="f"></i></div>
      <div class="small" style="margin-top:10px">Пример: один сервер, один запрос — <b>3 успеха из 10</b>. Откуда цифра — увидим дальше.</div>
    </div>
  </div>
  <aside class="notes">Вторая половина рамки — и ключевое различие для тестировщика. Слева мир, в котором мы живём: один вход даёт один выход, вердикт булев — pass или fail. Справа агент: тот же запрос модель может отработать по-разному, поэтому «вызывает тул правильно» — не да/нет, а <strong>частота, success rate</strong>. И проверяем мы теперь не только код, но и <strong>текст, который модель читает</strong>. Для тестировщика это звучит непривычно, но это нормальный измеримый режим. Держим контраст в голове — а теперь смотрим, что бывает, когда правый мир тестируют инструментами левого.</aside>
</section>

<!-- ===== 04 ===== -->
<section class="slide" data-block="Открытие">
  <div class="eyebrow"><span>Открытие</span><span>04 / 24</span></div>
  <h1>Тесты зелёные. <span class="badc">Продукт не работает.</span></h1>
  <div class="cols">
    <div class="col">
      <figure class="shot" data-src="shots/shot-1.png">
        <div class="shot-tag">Скрин №1</div>
        <div class="shot-desc">Терминал: прогон тестов — «Tests run: 26, Failures: 0 · BUILD SUCCESS · Coverage 78%». Крупно, зелёное.</div>
      </figure>
    </div>
    <div class="col">
      <figure class="shot" data-src="shots/shot-2.png">
        <div class="shot-tag">Скрин №2</div>
        <div class="shot-desc">Диалог с агентом: «Найди все просроченные задачи Алексея» → вызов <code>query_items(filter: "assignee=Алексей AND status=overdue")</code> → <code>[]</code> → «У Алексея нет просроченных задач». Виден вызов и пустой ответ. Подпись: «в базе их три».</div>
      </figure>
    </div>
  </div>
  <aside class="notes">Рамка задана — теперь обещанная проблема, ровно на стыке двух миров. <strong>Слева</strong> — прогон тестов MCP-сервера, интеграции трекера задач с ИИ-ассистентом. Всё зелёное, покрытие под 80%. Отдаём в прод? <strong>(пауза 3 сек)</strong> Мы отдали. <strong>Справа</strong> — первый пользовательский сценарий. Обратите внимание: агент не растерялся и не сообщил об ошибке. Он нашёл нужный тул, вызвал его и уверенно ответил пользователю. Ответ неверный: просроченных задач у Алексея три. Сервер вернул пустой список, потому что не понял формат фильтра, — и промолчал об этом. Такой отказ хуже честной ошибки: он выглядит как нормальный ответ, его не видно ни в логах, ни в мониторинге. Все тесты прошли — продукт не работает. И баг не находится ни в одной строчке кода.</aside>
</section>

<!-- ===== 05 ===== -->
<section class="slide" data-block="Открытие">
  <div class="eyebrow"><span>Открытие · под капотом</span><span>05 / 24</span></div>
  <h1>Код <span class="good">зелёный</span>. Тот же тул через агента — <span class="badc">пустой ответ</span></h1>
  <div class="cols">
    <div class="col">
      <div class="lbl">Юнит-тест тула · ToolBehaviourTest (v1)</div>
<pre style="font-size:12px"><span class="c">// формат, который ждёт код → находит</span>
<span class="k">@Test</span> void findsTasksByKeywordFilter() {
  var r = tools.queryItems(<span class="s">"Алексей overdue"</span>);
  assertThat(text(r)).contains(<span class="s">"T-1"</span>,<span class="s">"T-2"</span>,<span class="s">"T-3"</span>); <span class="c">// ✅ 3 задачи</span>
}
<span class="c">// формат, что агент придумал по описанию</span>
<span class="k">@Test</span> void agentGuessedFilterFindsNothing() {
  var r = tools.queryItems(<span class="s">"assignee=Алексей AND status=overdue"</span>);
  assertThat(isError(r)).isFalse();
  assertThat(text(r)).isEqualTo(<span class="s">"[]"</span>);        <span class="c">// ✅ тоже зелёный!</span>
}</pre>
      <div class="small">Тот же тул, тот же стор. Верный формат находит три задачи — <b>код исправен</b>. Формат агента даёт молчаливый <code>[]</code>, и это <b>штатное поведение</b>.</div>
    </div>
    <div class="col">
      <div class="lbl">Тот же тул — глазами агента</div>
<pre style="font-size:12.5px"><span class="k">@McpTool</span>(name=<span class="s">"query_items"</span>,
  description=<span class="badc">"Queries items using filter"</span>)  <span class="c">// ← всё, что видит агент</span>
CallToolResult queryItems(String filter)</pre>
      <div class="chain" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:8px">
        <div class="node" style="text-align:left">«Найди все просроченные задачи Алексея»</div>
        <div class="arr" style="align-self:center;font-size:14px">↓ формат не описан — агент подставляет произвольный</div>
        <div class="node" style="text-align:left;border-color:rgba(224,86,79,.45)"><code>query_items(filter:<br>&nbsp;&nbsp;"assignee=Алексей AND status=overdue")</code></div>
        <div class="arr" style="align-self:center">↓</div>
        <div class="node" style="text-align:left"><span class="badc">[]</span> → «Просроченных задач нет»</div>
      </div>
    </div>
  </div>
  <div class="banner">Юнит-тест проверяет <b>код</b> — он исправен. Сценарий ломает <b>описание</b>, а его этот тест не видит</div>
  <aside class="notes">Спускаемся под капот того же бага. <strong>Слева — реальный юнит-тест нашего тула</strong>, ToolBehaviourTest. Первый метод доказывает, что <strong>код исправен</strong>: зовём queryItems в формате, который он ждёт, — «Алексей overdue», два ключевых слова через пробел, — и получаем ровно три задачи, T-1, T-2, T-3. Второй метод — тот же тул, но с той самой строкой, которую по описанию придумал агент: «assignee=Алексей AND status=overdue». Подстрочный поиск не находит ничего, возвращается пустой список, и тест на это <strong>тоже зелёный</strong>: он фиксирует, что код отработал без ошибки. Вот ловушка — тот же тул, тот же стор, разница только в формате аргумента, и оба теста зелёные. <strong>Справа — тот же тул глазами агента:</strong> всё, что модель про него знает, — имя, схема {filter: string} и описание «Queries items using filter». Про формат фильтра ни слова. Поэтому агент подставляет произвольный фильтр вида assignee=Алексей AND status=overdue, подстрочный поиск по нему не находит ничего, и наружу уходит пустой список. Код зелёный — сценарий сломан описанием.</aside>
</section>

<!-- ===== 06 ===== -->
<section class="slide" data-block="Открытие">
  <div class="eyebrow"><span>Открытие · один запрос сквозь слои</span><span>06 / 24</span></div>
  <h1>Анатомия запроса: где именно <span class="hl">теряется смысл</span></h1>
  <div class="chain">
    <div class="node">Пользователь<em>«просроченные задачи Алексея»</em></div><div class="arr">→</div>
    <div class="node" style="border-color:rgba(224,86,79,.45)">Агент · host<em>видит только description + schema → подставляет произвольный аргумент</em></div><div class="arr">→</div>
    <div class="node">MCP-сервер · тул<em>query_items(filter) → поиск по словам через пробел, найтись должны все</em></div><div class="arr">→</div>
    <div class="node">Наружу · данные<em>TaskStore: совпадений нет</em></div>
  </div>
  <div class="cols" style="margin-top:24px;flex:0 1 auto">
    <div class="col card" style="border-color:rgba(224,86,79,.4)">
      <div class="lbl" style="color:var(--bad)">что видит агент на втором шаге</div>
<pre style="font-size:13px"><span class="badc">"description": "Queries items using filter"</span>
<span class="c">// про формат фильтра — ни слова</span>
→ агент подставляет <span class="badc">"assignee=Алексей AND status=overdue"</span></pre>
    </div>
    <div class="col card">
      <div class="lbl">обратный путь — наружу к пользователю</div>
      <div class="small" style="font-size:16px"><code>[]</code> → агент → <b>«Просроченных задач нет»</b>. Ни исключения, ни красной строки в логах — <span class="badc">молчаливо неверный ответ</span>.</div>
    </div>

<script>
(function(){
  var stage=document.getElementById('stage');
  stage.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=[].slice.call(stage.querySelectorAll('.slide'));
  var bar=document.getElementById('bar'),count=document.getElementById('count'),notes=document.getElementById('notes');
  var i=0;

  // screenshots: swap placeholder for image when file exists next to deck (shots/*.png)
  [].forEach.call(stage.querySelectorAll('.shot[data-src]'),function(f){
    var img=new Image();
    img.onload=function(){f.appendChild(img);f.classList.add('has-img');};
    img.src=f.getAttribute('data-src');
  });

  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(s,k){s.classList.toggle('on',k===i);});
    bar.style.width=((i+1)/slides.length*100)+'%';
    count.textContent=(i+1)+' / '+slides.length;
    var a=slides[i].querySelector('.notes');
    notes.innerHTML=a?('<b style="font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--amber)">ЗАМЕТКИ · СЛАЙД '+(i+1)+'</b><br>'+a.innerHTML):'';
    location.hash=i+1;
  }
  function fit(){
    var s=Math.min(innerWidth/1280,innerHeight/720);
    stage.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  addEventListener('resize',fit);
  addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') show(i+1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp') show(i-1);
    else if(e.key==='Home') show(0);
    else if(e.key==='End') show(slides.length-1);
    else if(e.key==='n'||e.key==='N') notes.classList.toggle('show');
  });
  stage.addEventListener('click',function(e){ show(e.clientX>innerWidth/2? i+1 : i-1); });
  fit();
  show((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
